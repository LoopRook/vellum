<!-- @dsCard group="Components" name="Toolbars &amp; Segmented Controls" subtitle="Multi-row control trays, segmented mode pills, steppers, and calibrated sliders" viewport="640x480" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vellum — Toolbars &amp; Segmented Controls</title>
<link rel="stylesheet" href="../styles.css" />
<style>
.demo { max-width: 1000px; width: 100%; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-8); }
.demo-head {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted);
  margin: var(--space-6) 0 var(--space-3);
}
.theme-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }
</style>
</head>
<body>
<main class="demo">
  <div class="theme-toggle-row">
    <button data-mode-toggle class="btn btn-control" onclick="const d = document.documentElement.getAttribute('data-theme') === 'dark'; if(d) { document.documentElement.removeAttribute('data-theme'); } else { document.documentElement.setAttribute('data-theme', 'dark'); }">TOGGLE DARK</button>
  </div>

  <div class="demo-head">3-Row Tactile Control Console (Swiss Dual-Rail Alignment)</div>

  <div class="console-card">
    <!-- Row 1: Display Mode (Solid Active Inversion) & Stepper -->
    <div class="console-row">
      <div class="console-group">
        <span class="label label-left">LAYOUT:</span>
        <button class="btn-control active" onclick="this.parentElement.querySelectorAll('.btn-control').forEach(b=>b.classList.remove('active')); this.classList.add('active');">GRID VIEW</button>
        <button class="btn-control" onclick="this.parentElement.querySelectorAll('.btn-control').forEach(b=>b.classList.remove('active')); this.classList.add('active');">LIST VIEW</button>
      </div>

      <div class="console-group">
        <span class="label label-right">ENTRY:</span>
        <button class="btn-stepper" onclick="const e=document.getElementById('demoEntry'); let val=parseInt(e.textContent.split('/')[0]); val = val > 1 ? val - 1 : 4; e.textContent=`${val}/4`">← PREV</button>
        <span id="demoEntry" style="font-family: var(--font-mono); text-transform: uppercase; font-size: 12px; color: var(--color-text-secondary); min-width: 32px; text-align: center;">2/4</span>
        <button class="btn-stepper" onclick="const e=document.getElementById('demoEntry'); let val=parseInt(e.textContent.split('/')[0]); val = val < 4 ? val + 1 : 1; e.textContent=`${val}/4`">NEXT →</button>
      </div>
    </div>

    <!-- Row 2: Geometry & Layout Axis (Outline Active Chip) -->
    <div class="console-row-sub">
      <div class="console-group">
        <span class="label label-left">AXIS:</span>
        <button class="btn-chip active" onclick="this.parentElement.querySelectorAll('.btn-chip').forEach(b=>b.classList.remove('active')); this.classList.add('active');">45° DIAG</button>
        <button class="btn-chip" onclick="this.parentElement.querySelectorAll('.btn-chip').forEach(b=>b.classList.remove('active')); this.classList.add('active');">HORIZ</button>
        <button class="btn-chip" onclick="this.parentElement.querySelectorAll('.btn-chip').forEach(b=>b.classList.remove('active')); this.classList.add('active');">VERT</button>
      </div>
    </div>

    <!-- Row 3: Presets (Outline Active Chip) & Status/Audio Toggle + Slider -->
    <div class="console-row-sub">
      <div class="console-group">
        <span class="label label-left">SPEED:</span>
        <button class="btn-chip active" onclick="this.parentElement.querySelectorAll('.btn-chip').forEach(b=>b.classList.remove('active')); this.classList.add('active');">FLUID (1250<span class="unit">ms</span>)</button>
        <button class="btn-chip" onclick="this.parentElement.querySelectorAll('.btn-chip').forEach(b=>b.classList.remove('active')); this.classList.add('active');">SNAPPY (700<span class="unit">ms</span>)</button>
      </div>

      <div class="console-group">
        <span class="label label-right">AUDIO:</span>
        <button class="btn-status-toggle" id="demoSoundBtn" onclick="const s = this.textContent.trim() === 'SOUND ON'; this.textContent = s ? 'MUTED' : 'SOUND ON'; this.style.borderColor = s ? 'var(--color-action-border)' : 'var(--color-status-emerald)'; this.style.color = s ? 'var(--color-text-secondary)' : 'var(--color-status-emerald)'; this.style.backgroundColor = s ? 'transparent' : 'color-mix(in srgb, var(--color-status-emerald) 10%, transparent)';">
          SOUND ON
        </button>
        <input type="range" class="range-slider" min="0" max="100" value="46" style="--range-progress: 46%;" oninput="this.style.setProperty('--range-progress', this.value + '%'); document.getElementById('demoCal').textContent=this.value+'%'" />
        <span id="demoCal" style="font-family: var(--font-mono); text-transform: uppercase; font-size: 11px; color: var(--color-text-primary); font-weight: 700; width: 28px;">46%</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
