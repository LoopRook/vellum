<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vellum — Cover Thumbnail</title>
<link rel="stylesheet" href="styles.css" />
<style>
/* The cover is led by the name (DECISIONS 070). No sheet at all: the seamless-header case (GRAMMAR §2.3),
   so the lamps read straight through and carry the brand behind very large type. */
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--color-bg-canvas);
}
.cover {
  position: relative;
  z-index: 1;
  box-sizing: border-box;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: var(--space-8) var(--space-12) var(--space-8);
}
.cover-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-4);
}
.cover-eyebrow { letter-spacing: var(--tracking-mono-wide); color: var(--color-text-secondary); }
.cover-version { color: var(--color-text-secondary); }
.cover-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  column-gap: var(--space-12);
  row-gap: var(--space-3);
}
.cover-name {
  font-size: var(--type-hero);
  line-height: var(--leading-display);
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
  margin: 0;
  /* Geist's caps sit above the line box's floor; this pulls the baseline onto the padding. */
  margin-bottom: calc(var(--type-hero) * -0.06);
}
.cover-line {
  max-width: 44ch;
  margin: 0;
  font-size: var(--type-body);
  line-height: var(--leading-body);
  color: var(--color-text-secondary);
}
</style>
</head>
<body>
<div class="light-table"></div>
<div class="cover">
  <div class="cover-top">
    <span class="label cover-eyebrow">DESIGN SYSTEM</span>
    <span class="label cover-version literal" id="sfVersion">…</span>
  </div>
  <div class="cover-foot">
    <h1 class="cover-name">VELLUM</h1>
    <p class="cover-line">Translucent sheets on a light table, lit by lamps.</p>
  </div>
</div>
<script src="tokens.generated.js"></script>
<script>
/* The version reads the token file rather than restating it. */
document.getElementById('sfVersion').textContent = 'v' + VellumTokens.VERSION;
</script>
</body>
</html>
