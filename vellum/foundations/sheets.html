<!-- @dsCard group="Foundations" name="Sheets &amp; Depth" subtitle="The blur ladder, sheet edges, and why a sheet needs the light table behind it" viewport="640x560" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vellum — Sheets &amp; Depth</title>
<link rel="stylesheet" href="../styles.css" />
<style>
.demo { max-width: 1000px; width: 100%; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-8); position: relative; z-index: 1; }
.demo-head {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted);
  margin: var(--space-6) 0 var(--space-3);
}
.sheet-showcase {
  padding: 24px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}
.theme-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="light-table"></div>

<main class="demo">
  <div class="theme-toggle-row">
    <button data-mode-toggle class="btn btn-control" onclick="const d = document.documentElement.getAttribute('data-theme') === 'dark'; if(d) { document.documentElement.removeAttribute('data-theme'); } else { document.documentElement.setAttribute('data-theme', 'dark'); }">TOGGLE DARK</button>
  </div>

  <div class="demo-head">Sheet at stage depth (40<span class="unit">px</span> blur, 1<span class="unit">px</span> edge in light)</div>
  <div class="card sheet-showcase">
    <div style="font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: var(--tracking-title); margin-bottom: 8px;">Sheet</div>
    <p>A sheet of vellum lit from behind by the lamps of the light table.</p>
    
    <div class="tray" style="padding: 16px; margin-top: 16px;">
      <div style="font-family: var(--font-mono); text-transform: uppercase; font-size: 11px; font-weight: 700; color: var(--color-text-muted); margin-bottom: 8px;">TRAY (20<span class="unit">px</span> blur)</div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-control active">MODE 01</button>
        <button class="btn btn-control">MODE 02</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
